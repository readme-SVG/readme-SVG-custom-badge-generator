name: Lint and Static Checks

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install server dependencies
        run: npm ci --prefix server --no-audit --no-fund

      - name: Check JavaScript and Python syntax
        run: |
          node --check app.js
          node --check badge-core.js
          node --check api/badge.js
          node --check api/iconFetcher.js
          python -m py_compile api/*.py process_event.py scripts/*.py "trigger action/trigger_action.py"

      - name: Build TypeScript server
        run: npm run build --prefix server

      - name: Run JavaScript and server tests
        run: node --test tests/*.test.js

      - name: Run Python tests and verify sample badges
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/refresh_sample_svgs.py
          git diff --exit-code -- sample_svgs/
